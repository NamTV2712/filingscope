name: Offline backend

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install locked CPU test dependencies and cache the pinned tokenizer
        env:
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/filingscope-tokenizer
        run: |
          python -m pip install uv==0.11.28
          uv sync --locked --python 3.12
          uv pip check
          uv run --offline --locked python -c "import tiktoken; tiktoken.get_encoding('cl100k_base')"
      - name: Check tracked files, syntax, lint and policy types
        run: |
          uv run --offline --locked python -m scripts.check_tracked_secrets
          uv run --offline --locked python -m compileall -q configs scripts src tests
          uv run --offline --locked ruff check configs scripts src tests
          uv run --offline --locked mypy
      - name: Run offline unit, regression and lightweight evaluation checks
        env:
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/filingscope-tokenizer
        run: uv run --offline --locked python -m scripts.run_offline_checks
      - name: Run optional Inline XBRL parser fixtures
        run: |
          uv sync --locked --extra ixbrl
          uv run --offline --locked --extra ixbrl python -m pytest -q tests/test_inline_xbrl.py
