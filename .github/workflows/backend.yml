name: Offline backend

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Check tracked files and Python syntax
        run: |
          python -m scripts.check_tracked_secrets
          python -m compileall -q configs scripts src tests
      - name: Install CPU test dependencies and cache the pinned tokenizer
        env:
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/filingscope-tokenizer
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.15.0+cpu'
          python -m pip install -r requirements.txt
          python -m pip check
          python -c "import tiktoken; tiktoken.get_encoding('cl100k_base')"
      - name: Run offline unit, regression and lightweight evaluation checks
        env:
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/filingscope-tokenizer
        run: python -m scripts.run_offline_checks
